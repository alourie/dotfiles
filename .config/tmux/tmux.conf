# ~/.config/tmux/tmux.conf  (plain tmux, byobu removed)

# ---- terminal / behaviour ----
set-option -a terminal-features 'ghostty:RGB'
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"
set -g default-command 'exec $SHELL'
set -g renumber-windows on
set -s escape-time 0
set -g base-index 1
set -g focus-events on
set -g history-limit 100000
set -g mode-keys vi
set -g status-keys vi
set -g monitor-activity on

# ---- colours (byobu scheme) ----
set -g status-interval 1
set -g status-style "bg=#333333,fg=#EEEEEE"
set -g status-left-length 256
set -g status-left '#[default]#[fg=black,bg=brightwhite] #S #[default]#[fg=black]#[bg=#333333] #[default]'
set -g status-right-length 256
# must be set before the plugin run line (continuum prepends to it)
set -g status-right '%H:%M:%S'
set -g window-status-style "bg=#333333,fg=#EEEEEE"
set -g window-status-current-style "bg=#333333,fg=#EEEEEE,reverse"
set -g window-status-activity-style "bg=#333333,fg=#EEEEEE,bold"
set -g pane-border-style "fg=#75507B"
set -g pane-active-border-style "bg=#DD4814,fg=#DD4814"
set -g message-style "bg=#75507B,fg=white"
set -g mode-style "bg=#75507B,fg=#EEEEEE"
set -g clock-mode-colour "#75507b"
set -g display-panes-colour "#75507b"
set -g display-panes-active-colour "#dd4814"

# ---- prefix ----
set -g prefix F12

# ---- keys (byobu-style, root table) ----
bind-key -n F2 new-window -c "#{pane_current_path}"
bind-key -n C-S-F2 new-session
bind-key -n F3 run-shell "$HOME/Projects/zsh_functions/update-tmux-pane #{pane_current_path}"
bind-key -n F6 detach-client
bind-key -n F7 copy-mode
bind-key -n F8 command-prompt -I "#W" -p "(rename-window) " { rename-window "%%" }
bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n M-Up switch-client -p
bind-key -n M-Down switch-client -n
bind-key -n C-b set-option -g status
bind-key -T root C-f choose-tree -Zs

# ---- plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# keep at the very bottom
run '$HOME/Projects/personal/tmux-plugins/tpm/tpm'
